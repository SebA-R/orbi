<!doctype html>
<!-- Orbi Desktop's overlay: the extension's own overlays (the subtitle card
     with the orb, the frame ring, the agent cursor) in a transparent,
     click-through web view over the screen. ext/ holds the extension's
     files, copied in by scripts/bundle.sh; bridge.js drives them. -->
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src orbi-overlay:; style-src 'unsafe-inline'">
<style>html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }</style>
<script src="shim.js"></script>
<script src="ext/orb-face.js"></script>
<script src="ext/subtitles.js"></script>
<script src="ext/frame.js"></script>
<script src="ext/cursor.js"></script>
<script type="module" src="bridge.js"></script>
</head>
<body></body>
</html>
