<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Orbi</title>
  <link rel="stylesheet" href="../lib/ui.css">
  <link rel="stylesheet" href="popup.css">
  <script src="../content/orb-face.js"></script>
</head>
<body>
  <main>
    <header class="top">
      <span class="mini-orb" id="mini-orb"></span>
      <h1>Orbi <span id="danger-chip" class="danger-chip" hidden>Danger mode</span></h1>
      <a class="icon" id="gear" href="../options/options.html" aria-label="All settings">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"></path></svg>
      </a>
    </header>

    <section class="hero" aria-label="Voice">
      <span class="orb" id="orb" data-state="idle" aria-hidden="true"></span>
      <div class="voice" id="voice" role="status" aria-live="polite">
        <p class="voice-title" id="voice-title">Ready</p>
        <p class="voice-sub" id="voice-sub">Hold Space on any page to talk.</p>
      </div>
      <form class="type-box" id="type-form" hidden>
        <p class="type-note" id="type-note">Basic voice (no Cartesia key). If talking doesn't work, type here.</p>
        <div class="type-row">
          <label class="visually-hidden" for="type-text">Type to Orbi</label>
          <input id="type-text" type="text" placeholder="Type to Orbi" autocomplete="off" maxlength="2000" enterkeyhint="send">
          <button type="submit">Send</button>
        </div>
      </form>
      <button type="button" class="pill" id="setup-pill" data-state="wait">
        <span class="pill-face">
          <svg class="pill-check" aria-hidden="true" width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 6.2l2.3 2.3 4.7-5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          <span id="setup-text">Checking setup</span>
        </span>
      </button>
    </section>

    <section class="sheet" aria-label="Settings">
      <span class="handle" aria-hidden="true"></span>
      <div class="row">
        <span id="provider-label">Model</span>
        <div class="seg" role="radiogroup" aria-labelledby="provider-label">
          <label>Claude<input type="radio" name="provider" value="claude"></label>
          <label>Local<input type="radio" name="provider" value="local"></label>
        </div>
      </div>
      <div class="row" id="claude-model-row" hidden><label class="visually-hidden" for="claude-model">Claude model</label><select id="claude-model" class="sel"></select></div>
      <div class="local-line" id="local-line" hidden>
        <span class="local-chip" id="local-chip" data-state="wait" role="status"></span>
      </div>
      <p id="provider-note" class="note info" role="status" hidden></p>
      <div class="row">
        <span id="mode-label">Browse</span>
        <div class="seg" role="radiogroup" aria-labelledby="mode-label">
          <label>Open web<input type="radio" name="browseMode" value="open"></label>
          <label>Allowed sites<input type="radio" name="browseMode" value="allowlist"></label>
        </div>
      </div>
      <div class="row"><label for="hotkey">Talk key</label><select id="hotkey" class="sel"></select></div>
      <div class="row">
        <label for="speed">Speaking speed</label>
        <span class="speed"><input id="speed" type="range" step="0.1"><output id="speed-out" for="speed"></output></span>
      </div>
      <label class="row" for="guided-mode"><span>Guided mode. Made for blind and low-vision users: Orbi describes each page, reads out choices and lets you pick.</span><input id="guided-mode" class="sw" type="checkbox" role="switch"></label>
      <label class="row speak-row" for="speak-replies"><span id="speak-replies-label">Speak replies. Turn off to read Orbi's answers in the subtitles without hearing them.</span><input id="speak-replies" class="sw" type="checkbox" role="switch" aria-labelledby="speak-replies-label" aria-describedby="speak-replies-note"></label>
      <p id="speak-replies-note" class="note" role="status" hidden></p>
      <label class="row" for="subtitles"><span>Subtitles on the page</span><input id="subtitles" class="sw" type="checkbox" role="switch"></label>
      <label class="row" for="error-pages"><span>Replace Chrome error pages with Orbi's page</span><input id="error-pages" class="sw" type="checkbox" role="switch"></label>
      <label class="row" for="sounds"><span>Sounds</span><input id="sounds" class="sw" type="checkbox" role="switch"></label>
      <label class="row" for="quiet-tabs"><span>Quiet other tabs while talking</span><input id="quiet-tabs" class="sw" type="checkbox" role="switch"></label>
      <label class="row" for="follow-tab"><span>Follow Orbi to its tab</span><input id="follow-tab" class="sw" type="checkbox" role="switch"></label>
      <label class="row" for="watchable-pace"><span>Show actions at a watchable pace</span><input id="watchable-pace" class="sw" type="checkbox" role="switch"></label>
      <label class="row" for="show-cursor"><span>Show Orbi's cursor</span><input id="show-cursor" class="sw" type="checkbox" role="switch"></label>
      <label class="row danger-row" for="danger-mode"><span>Danger mode. Orbi acts on its own with no locks, including placing orders with your saved card without asking. It still never sees your card or passwords, and blocked sites stay blocked.</span><input id="danger-mode" class="sw" type="checkbox" role="switch"></label>
      <p id="danger-confirm" class="danger-confirm" hidden><button type="button" id="danger-yes">Turn on Danger mode</button><button type="button" id="danger-no">Cancel</button></p>
      <p id="danger-local" class="danger-confirm" role="status" hidden></p>
      <nav class="links" aria-label="More settings">
        <a id="all-settings" href="../options/options.html">All settings</a>
        <a id="blocked-sites" href="../options/options.html#blocked-sites">Blocked sites</a>
      </nav>
    </section>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
