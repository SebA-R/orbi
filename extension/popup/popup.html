<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Clearcart</title>
  <link rel="stylesheet" href="../setup/setup.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>Clearcart</h1>
    <section aria-labelledby="setup-heading">
      <h2 id="setup-heading">Setup</h2>
      <div id="checklist"></div>
    </section>

    <section aria-labelledby="settings-heading">
      <h2 id="settings-heading">Settings</h2>
      <fieldset>
        <legend>Browse mode</legend>
        <label class="radio"><input type="radio" name="browseMode" value="open"> <span>Open web: any store, except blocked sites</span></label>
        <label class="radio"><input type="radio" name="browseMode" value="allowlist"> <span>Only the allowed sites</span></label>
      </fieldset>
      <label for="hotkey">Talk key</label>
      <select id="hotkey"></select>
      <p class="hint">Hold Space to talk. Option+Space keeps listening until you press Space.</p>
      <label for="speed">Speaking speed: <output id="speed-out" for="speed"></output></label>
      <input id="speed" type="range" step="0.1">
      <label class="check"><input id="subtitles" type="checkbox"> Show subtitles on the page</label>
      <label class="check"><input id="quiet-tabs" type="checkbox"> Quiet other tabs while talking</label>
    </section>

    <nav aria-label="More settings">
      <ul class="links">
        <li><a id="all-settings" href="../options/options.html">All settings</a></li>
        <li><a id="blocked-sites" href="../options/options.html#blocked-sites">Blocked sites</a></li>
      </ul>
    </nav>
    <p id="live" role="status" aria-live="polite" class="hint"></p>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
